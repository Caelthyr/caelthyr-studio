<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ffffff" />
    <meta
      name="description"
      content="Caelthyr Studio — film and visual storytelling."
    />
    <title>Caelthyr Studio</title>

    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        min-height: 100%;
        margin: 0;
        background: #fff;
      }

      body {
        min-height: 100svh;
        overflow: hidden;
      }

      .artwork {
        display: block;
        width: 100vw;
        height: 100svh;
        object-fit: contain;
        object-position: center;
        user-select: none;
        -webkit-user-drag: none;
      }

      .instagram-link {
        position: fixed;
        right: max(22px, env(safe-area-inset-right));
        bottom: max(22px, env(safe-area-inset-bottom));
        z-index: 1;
        display: grid;
        width: 38px;
        height: 38px;
        place-items: center;
        color: #000;
        border-radius: 50%;
        background: rgb(255 255 255 / 72%);
        transition:
          transform 160ms ease,
          background-color 160ms ease;
        -webkit-tap-highlight-color: transparent;
      }

      .instagram-link:hover {
        transform: translateY(-2px);
        background: #fff;
      }

      .instagram-link:focus-visible {
        outline: 2px solid #000;
        outline-offset: 3px;
      }

      .instagram-icon {
        width: 22px;
        height: 22px;
      }

      /* Fill tall phone screens while keeping the complete artwork visible on
         wider laptop and desktop displays. */
      @media (max-aspect-ratio: 4 / 5) {
        .artwork {
          object-fit: cover;
        }
      }

      @media (max-width: 600px) {
        .instagram-link {
          right: max(16px, env(safe-area-inset-right));
          bottom: max(16px, env(safe-area-inset-bottom));
          width: 36px;
          height: 36px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .instagram-link {
          transition: none;
        }
      }
    </style>
  </head>

  <body>
    <img
      class="artwork"
      src="./assets/caelthyr-studio.png"
      alt="Caelthyr Studio artwork with sweeping black-and-white film strips"
    />

    <a
      class="instagram-link"
      href="https://www.instagram.com/caelthyrstudio/"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Visit Caelthyr Studio on Instagram"
    >
      <svg
        class="instagram-icon"
        viewBox="0 0 24 24"
        fill="none"
        aria-hidden="true"
      >
        <rect
          x="3"
          y="3"
          width="18"
          height="18"
          rx="5"
          stroke="currentColor"
          stroke-width="2"
        />
        <circle
          cx="12"
          cy="12"
          r="4.25"
          stroke="currentColor"
          stroke-width="2"
        />
        <circle cx="17.4" cy="6.7" r="1.2" fill="currentColor" />
      </svg>
    </a>
  </body>
</html>
